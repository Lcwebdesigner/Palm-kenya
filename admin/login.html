<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrator Login | Palm Foundation Kenya</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portal.css"><link rel="stylesheet" href="../css/admin.css"><style>.login-wrap{max-width:460px;margin:7vh auto;padding:18px}.login-card{background:#fff;border:1px solid #e5eee8;border-radius:20px;padding:32px;box-shadow:0 20px 55px #163b2812}.login-card h1{margin:12px 0}.login-card label{display:grid;gap:7px;margin:18px 0;font-weight:650}.login-card input{padding:13px;border:1px solid #dce6df;border-radius:9px;font:inherit;width:100%;box-sizing:border-box}.login-mark{font-size:34px}</style></head><body class="admin-body"><header class="portal-header"><a class="brand" href="../index.html"><span class="mark">🌴</span><span>THE PALM FOUNDATION<small>KENYA · ADMIN</small></span></a><a href="../index.html">Public website</a></header><main class="login-wrap"><section class="login-card"><div class="login-mark">🌴</div><span class="tag">Restricted access</span><h1>Administrator sign in</h1><p class="admin-muted">Sign in with an authorised foundation administrator account.</p><form id="adminLoginForm"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="admin-btn" type="submit" style="width:100%;padding:13px">Sign in securely</button><p id="adminLoginMessage" class="admin-message" role="status"></p></form><p class="admin-muted">Access is restricted to accounts registered in the foundation's admin allowlist.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/admin-login.js"></script></body></html>
