<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login | The Palm Foundation Kenya</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portal.css"></head><body><header class="portal-header"><a class="brand" href="../index.html"><span class="mark">🌴</span><span>THE PALM FOUNDATION<small>KENYA</small></span></a><a href="register.html">Apply to join</a></header><main class="portal-wrap"><section class="portal-card"><span class="tag">Member access</span><h1>Member login</h1><p>Approved members can sign in using their membership number and password.</p><form id="memberLoginForm"><label>Membership number<input name="membership_number" placeholder="PALM-2026-0001" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Log in</button><p id="loginMessage" class="form-message" role="status"></p></form><hr><h2>First-time login?</h2><p>After approval, the administrator will give you a one-time activation code. Use it to set your own password.</p><form id="activationForm"><label>Membership number<input name="membership_number" required placeholder="PALM-2026-0001"></label><label>One-time activation code<input name="activation_code" required autocomplete="one-time-code"></label><label>Create password<input name="new_password" type="password" required minlength="10" autocomplete="new-password"><span class="help">Use at least 10 characters.</span></label><label>Confirm password<input name="confirm_password" type="password" required minlength="10" autocomplete="new-password"></label><button class="btn secondary" type="submit">Activate account & set password</button><p id="activationMessage" class="form-message" role="status"></p></form><p class="small-note"><a href="../index.html">Return to website</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/member-auth.js"></script></body></html>
